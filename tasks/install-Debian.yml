---
- name: Remove the old Icinga APT repository line (with legacy GPG keyring)
  ansible.builtin.apt_repository:
    repo: "deb http://packages.icinga.com/{{ ansible_distribution | lower }} icinga-{{ ansible_distribution_release }} main"
    state: absent
    filename: icinga
    update_cache: false

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - rsync
      - nmap
      - bc
      - gpg
      - gpgv2
      - ca-certificates
    state: present

- name: Add Debian Backports Repository on Debian Stretch
  ansible.builtin.apt_repository:
    repo: deb http://deb.debian.org/debian {{ ansible_distribution_release | lower }}-backports main
    state: present
    filename: debian-backports
  when: ansible_distribution_release | lower == "stretch"

- name: Download and install the Icinga2 repository key
  ansible.builtin.apt:
    deb: "https://packages.icinga.com/icinga-archive-keyring_latest+{{ ansible_distribution | lower }}{{ ansible_distribution_major_version if ansible_distribution == 'Debian' else ansible_distribution_version }}.deb"
    state: present

- name: Add Icinga APT Repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/icinga-archive-keyring.gpg] http://packages.icinga.com/{{ ansible_distribution | lower }} icinga-{{ ansible_distribution_release }} main"
    state: present
    filename: icinga

- name: Install Icinga 2
  ansible.builtin.package:
    name: icinga2
    state: "{{ 'latest' if icinga2_client_upgrade else 'present' }}"
    update_cache: true
  notify: Restart Icinga2

- name: Install Monitoring Plugins
  ansible.builtin.apt:
    name: "{{ icinga2_debian_monitoring_plugins }}"
    state: present
    update_cache: true

- name: Install Monitoring Libraries
  ansible.builtin.apt:
    name: "{{ icinga2_debian_monitoring_libraries }}"
    state: present
    update_cache: true
