---
- name: Remove Icinga APT Repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/icinga.list
    state: absent

- name: Remove Icinga2
  ansible.builtin.apt:
    name: icinga2*
    state: absent
    purge: true
    force: true

- name: Remove Monitoring Plugins
  ansible.builtin.apt:
    name: "{{ icinga2_debian_monitoring_plugins }}"
    state: absent
    purge: true
    force: true
